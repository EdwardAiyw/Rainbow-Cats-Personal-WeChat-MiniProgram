<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菜谱详情 · 原型</title><link rel="stylesheet" href="../styles.css"></head><body><main class="shell"><header class="topbar"><a class="back" href="./recipe.html">‹</a><div><span class="kicker">RECIPE DETAIL</span><h1>菜谱详情</h1></div><button class="icon-button" data-toast="已收藏">♡</button></header><section class="card recipe-cover"><div class="recipe-photo orange large">🍜</div><h2>番茄鸡蛋面</h2><p>酸甜开胃的家常味道，忙碌的晚上也能很快做好。</p><div class="chips"><span>家常菜</span><span>20 分钟</span><span>简单</span></div></section><section class="card"><span class="label">食材</span><p>番茄 2 个 · 鸡蛋 2 个 · 面条 1 把 · 葱花适量</p></section><section class="card"><span class="label">步骤</span><p class="multiline">1. 番茄切块，鸡蛋打散。<br>2. 先炒鸡蛋盛出，再炒番茄出汁。<br>3. 加水煮开，放入面条和鸡蛋。</p></section></main><script src="../app.js"></script></body></html>
